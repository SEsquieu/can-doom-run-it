name: Build and native control tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux
          - os: windows-2022
            preset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config \
            libsdl2-dev libvpx-dev libbz2-dev libgl-dev libx11-dev libxcursor-dev \
            libasound2-dev xvfb xauth freedoom
      - name: Build pinned ZMusic
        run: python scripts/build-zmusic.py
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build engine
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Run Linux engine smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a python scripts/smoke-engine.py --iwad /usr/share/games/doom/freedoom2.wad
      - name: Stage development artifact
        run: python scripts/stage-dev.py ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        with:
          name: can-doom-run-it-${{ matrix.preset }}
          path: build/stage/${{ matrix.preset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/smoke/
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
