name: Build and native control tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            preset: linux
          - os: windows-2022
            preset: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install cmake==3.31.10 ninja==1.13.0
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y build-essential pkg-config \
            libsdl2-dev libvpx-dev libbz2-dev libgl-dev libx11-dev libxcursor-dev \
            libasound2-dev libxcb1-dev libopenal1 libxtst6 xvfb xauth freedoom
      - name: Build pinned ZMusic
        run: python scripts/build-zmusic.py
      - name: Fetch verified freely redistributable content
        run: python scripts/fetch-free-assets.py
      - name: Build pinned Windows audio runtime
        if: runner.os == 'Windows'
        run: python scripts/build-openal.py
      - name: Test actual Windows audio sample rendering
        if: runner.os == 'Windows'
        run: python scripts/test-audio-runtime.py --library build/deps/openal/bin/OpenAL32.dll
      - name: Configure
        run: cmake --preset ${{ matrix.preset }}
      - name: Build engine
        run: cmake --build --preset ${{ matrix.preset }}
      - name: Test native bus and loopback output
        run: ctest --test-dir build/${{ matrix.preset }} -C Release --output-on-failure
      - name: Test protocol consumer
        run: python -m unittest discover -s tests -p "test_*.py"
      - name: Test actual Linux keyboard endpoint
        if: runner.os == 'Linux'
        run: xvfb-run -a python scripts/test-keyboard-endpoint.py --preset linux
      - name: Test actual Windows keyboard endpoint
        if: runner.os == 'Windows'
        run: python scripts/test-keyboard-endpoint.py --preset windows
      - name: Test Windows sketchpad painting with full drawing history
        if: runner.os == 'Windows'
        run: build/windows/Release/doom-io-input-lab.exe --test-render build/sketchpad-render.json
      - name: Run Linux engine smoke test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: |
          xvfb-run -a python scripts/smoke-engine.py --controls --record-demo build/smoke/live/control-demo.lmp --iwad /usr/share/games/doom/freedoom2.wad
          xvfb-run -a python scripts/smoke-engine.py --controls --disable-output --iwad /usr/share/games/doom/freedoom2.wad
          xvfb-run -a python scripts/smoke-engine.py --controls --no-listener --iwad /usr/share/games/doom/freedoom2.wad
          xvfb-run -a python scripts/smoke-engine.py --controls --play-demo build/smoke/live/control-demo.lmp --iwad /usr/share/games/doom/freedoom2.wad
      - name: Run playable room and external software test
        if: runner.os == 'Linux'
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
          LP_NUM_THREADS: '2'
        run: |
          xvfb-run -a python scripts/smoke-engine.py --room --screenshot build/screenshots/first-run.png
          xvfb-run -a python scripts/smoke-engine.py --room --controls --external --screenshot build/screenshots/controls.png
          xvfb-run -a python scripts/smoke-engine.py --room --controls --record-demo build/smoke/room-live/control-demo.lmp
          xvfb-run -a python scripts/smoke-engine.py --room --controls --play-demo build/smoke/room-live/control-demo.lmp
          xvfb-run -a python scripts/smoke-engine.py --room --controls --disable-output
          xvfb-run -a python scripts/smoke-engine.py --room --controls --multiplayer
          xvfb-run -a python scripts/smoke-engine.py --room --view monitor --screenshot build/screenshots/monitor.png
          xvfb-run -a python scripts/test-first-run.py
      - name: Stage development artifact
        run: python scripts/stage-dev.py ${{ matrix.preset }}
      - uses: actions/upload-artifact@v4
        with:
          name: can-doom-run-it-${{ matrix.preset }}
          path: build/stage/${{ matrix.preset }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: doom-io-sketchpad-update-windows
          path: build/stage/sketchpad-windows
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-logs-${{ matrix.preset }}
          path: |
            build/smoke/
            build/screenshots/
            build/keyboard-endpoint.*
            build/audio-runtime.json
            build/sketchpad-render.json
            build/${{ matrix.preset }}/Testing/Temporary/
          if-no-files-found: ignore
